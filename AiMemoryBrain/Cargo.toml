[package]
name = "d_unicode_validator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
description = "D-contract Unicode 15.1.0 validator and build-time evidence tooling"

[lib]
name = "d_unicode_validator"
path = "src/lib.rs"

[[bin]]
name = "d-ucd-validate"
path = "src/bin/d-ucd-validate.rs"

[dependencies]
clap = { version = "=4.5.53", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
toml = "=0.9.8"

[build-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
